replicaCount: 2

image:
  repository: ecommerce-app
  tag: latest
  pullPolicy: Never

resources:
  limits:
    cpu: 256m
    memory: 256Mi
  requests:
    cpu: 128m
    memory: 128Mi

config:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "weather"
  DB_USER: "postgres"
  SERVER_HOST: "http://localhost:8080/"
  SERVER_PORT: "8080"
  WEATHER_API_KEY: "dummy"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USERNAME: "dummy@gmail.com"

secret:
  DB_PASSWORD: "postgres"
  EMAIL_PASSWORD: "dummy"

postgres:
  image: postgres:15
  resources:
    limits:
      cpu: 256m
      memory: 256Mi
    requests:
      cpu: 128m
      memory: 128Mi
